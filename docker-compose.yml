networks:
  graphify:
    enable_ipv6: true
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: 1
    ipam:
      config:
        - subnet: fd00:1::/64

services:
  graphify:
    image: sinfallas/remote-graphify:latest
    hostname: graphify
    container_name: graphify
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: graphifyy serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
#      - OLLAMA_MODEL=
#      - ANTHROPIC_API_KEY=example
#      - ANTHROPIC_MODEL=claude-sonnet-4-6
#      - GEMINI_API_KEY=example
#      - OPENAI_API_KEY=example
#      - OPENAI_BASE_URL=https://api.openai.com/v1
#      - OPENAI_MODEL=gpt-4.1-mini
    volumes:
      - ./app:/app:ro # This directory must be the directory where your agent writes the code.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - graphify
