networks:
  graphify:
    enable_ipv6: true
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: 1

services:
  graphify:
    image: sinfallas/remote-graphify:latest
    hostname: graphify
    container_name: graphify
    pull_policy: always
    restart: always
    ports:
      - 8080:8080
    command: uvx --from graphifyy python -m graphify.serve graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
    volumes:
      - ./app:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - graphify
